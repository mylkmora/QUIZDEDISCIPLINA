<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Disciplina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quiz de Disciplina</h1>

        <div class="barra-progresso">
            <div id="progresso"></div>
        </div>

        <div id="tela-quiz">
            <h2 id="pergunta"></h2>
            <div id="opcoes"></div>
        </div>

        <div id="tela-resultado" class="oculto">
            <h2 id="mensagem-final"></h2>
            <p id="pontuacao-final"></p>
            <button id="reiniciar">Reiniciar Quiz</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
